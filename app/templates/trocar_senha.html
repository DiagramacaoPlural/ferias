{% extends "base.html" %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <div>
    <h1>Trocar senha</h1>
    <p>Mínimo de {{ senha_min }} caracteres.</p>
  </div>
</div>

{% if current_user.trocar_senha %}
  <div class="alertas"><div class="alerta alerta-aviso">Por segurança, defina uma nova senha antes de continuar.</div></div>
{% endif %}

<div class="card form-estreito">
  <form method="post" class="card-corpo">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo">
      <label for="senha_atual">Senha atual</label>
      <input type="password" id="senha_atual" name="senha_atual" autocomplete="current-password" required autofocus>
    </div>
    <div class="campo">
      <label for="senha_nova">Nova senha</label>
      <input type="password" id="senha_nova" name="senha_nova" autocomplete="new-password" minlength="{{ senha_min }}" required>
    </div>
    <div class="campo">
      <label for="senha_confirmacao">Confirme a nova senha</label>
      <input type="password" id="senha_confirmacao" name="senha_confirmacao" autocomplete="new-password" minlength="{{ senha_min }}" required>
    </div>
    <button type="submit" class="btn btn-primario">Salvar nova senha</button>
  </form>
</div>
{% endblock %}
